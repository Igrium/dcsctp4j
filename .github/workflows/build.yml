name: Build native libraries

# These jobs check out the real WebRTC source and build the actual JNI native
# libraries with the same scripts documented in the README, so they are slow
# (WebRTC is large) and need a lot of disk space. If they start failing on
# standard GitHub-hosted runners due to disk/time limits, consider moving them
# to larger runners or a schedule instead of every push/PR.

on:
  push:
    paths:
      - "pom.xml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "resources/**"
      - "src/**"
      - "SimpleJNI"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "pom.xml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "resources/**"
      - "src/**"
      - "SimpleJNI"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (x86-64, arm64, ppc64le)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential g++-aarch64-linux-gnu g++-powerpc64le-linux-gnu cmake

      - name: Build
        run: resources/ubuntu-build-all.sh "$RUNNER_TEMP/depot_tools" "$RUNNER_TEMP/webrtc"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-native-libs
          path: src/main/resources/linux-*
          if-no-files-found: ignore

  macos:
    name: macOS (x86-64, arm64)
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build
        run: resources/macos-build-all.sh "$RUNNER_TEMP/depot_tools" "$RUNNER_TEMP/webrtc"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-native-libs
          path: src/main/resources/macos-*
          if-no-files-found: ignore

  windows:
    # Builds natively on a real windows-latest runner, with the MSVC toolset that
    # already ships on GitHub's Windows images (via ilammy/msvc-dev-cmd, which just
    # points PATH at it -- no download needed). This is a genuine native compile,
    # not the msvc-wine cross-compile from Linux that the README documents as the
    # no-real-Windows-machine-required path; resources/windows-build.sh supports
    # both by passing "-" as MSVC_DIR to mean "cl.exe/lib.exe are already on PATH".
    # Scoped to x86-64 only for now: GitHub doesn't offer a native arm64 Windows
    # runner, and cross-arch (x64 host targeting arm64) would need a separate
    # ilammy/msvc-dev-cmd setup, so it's left for later if needed.
    name: Windows (native, x86-64)
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      # Skip the WebRTC/Chromium DEPS hook that tries to download Google-internal
      # hermetic MSVC on Windows; use the system-installed Visual Studio instead.
      DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install make
        run: choco install -y make

      - name: Build
        shell: bash
        run: |
          set -e
          DEPOT_TOOLS_DIR="$(cygpath -u "$RUNNER_TEMP")/depot_tools"
          WEBRTC_DIR="$(cygpath -u "$RUNNER_TEMP")/webrtc"
          WEBRTC_REVISION="$(<resources/WebRTC-revision.txt)"
          mvn compile
          resources/checkout-webrtc.sh "$DEPOT_TOOLS_DIR" "$WEBRTC_DIR" "$WEBRTC_REVISION"
          resources/windows-build.sh "$(cygpath -u "$JAVA_HOME")" "$WEBRTC_DIR" - x86-64

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-libs
          path: src/main/resources/windows-*
          if-no-files-found: ignore
